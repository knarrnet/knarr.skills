# Settlement position check — autonomous netting proposal generator.
# Queries bilateral ledger, finds over-threshold positions, signs and
# submits netting proposals using thrall's delegated identity.
#
# Hotwire only — no LLM. Pure computation (ledger query + signing).
# Cooldown: 1 hour — positions change slowly.
#
# v3.4: Gathers position + settlement history via context gatherers
# before executing. When v0.36.0 ships, this routes through the
# review_settlement flow instead of direct execution.

mode = "automated"

[trigger]
type = "on_tick"

[filter]
cooldown_key = "settlement-check"
cooldown_seconds = 3600    # hourly

# Gather current positions + recent settlement history
[[gather]]
name = "positions"
source = "cockpit"
endpoint = "/api/positions"
threshold = "0.7"

[[gather]]
name = "recent_settlements"
source = "memory"
format = "prompt"
[gather.query]
skill = "settlement-review"
limit = "10"

[evaluate]
type = "hotwire"
default_action = "act"

[actions.act]
skill = "settlement-check-lite"
input = {}
error_buffer = "settlement-errors"
