# settlement-execute — Execute on-chain settlement transfer (Solana devnet).
#
# Fires when a settlement is accepted by the peer. Derives the peer's
# Solana address, checks wallet ceiling, submits a devnet transfer.
#
# This completes the autonomous settlement flow:
#   settlement-check (hourly) → propose netting → peer accepts →
#   settlement-execute (this) → BCW detects → payment-finalized confirms
#
# Safety: devnet only, wallet ceiling gated, 1h cooldown per peer.

mode = "automated"

[trigger]
type = "on_event"
event_pattern = "settlement.accepted"

[filter]
cooldown_key = "settle-exec-{{peer_public_key}}"
cooldown_seconds = 3600

[[gather]]
name = "economy"
source = "cockpit"
endpoint = "/api/economy"

[[gather]]
name = "wallet_status"
source = "memory"
format = "summary"
query = { node_id = "self", skill = "wallet" }

[evaluate]
type = "hotwire"
default_action = "execute_settlement"

[actions.execute_settlement]
skill = "settlement-execute-lite"
input = { peer_node_id = "{{peer_node_id}}", settle_amount = "{{settle_amount}}", chain = "solana_devnet" }
error_buffer = "settlement-errors"
